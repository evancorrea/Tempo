[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-api"
version = "0.1.0"
description = "Local-first evidence-grounded paper replication briefs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1,<2",
  "PyMuPDF>=1.24,<2",
  "pytesseract>=0.3.10,<1",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
